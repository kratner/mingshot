[package]
name = "mingshot"
version = "0.0.1"
description = "Screen capture and markup: click New, grab any part of the screen."
authors = ["Keith Ratner <keith@fourounces.live>"]
license = "MIT"
repository = "https://github.com/kratner/mingshot"
edition = "2024"

[lib]
name = "mingshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-image-io = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
