[package]
name = "mingshot"
version = "0.0.1"
description = "Screen capture and markup: click New, grab any part of the screen."
authors = ["Keith Ratner <keith@fourounces.live>"]
license = "MIT"
repository = "https://github.com/kratner/mingshot"
edition = "2024"

[lib]
name = "mingshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# catch-all: an Objective-C exception (e.g. a method this macOS doesn't have) becomes a Rust panic with its message,
# which the panic hook writes to the event log before the app exits (lib.rs), instead of a silent abort.
objc2 = { version = "0.6", features = ["catch-all"] }
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
# Only what MingShot uses, so the app doesn't pull in frameworks newer than Mojave (compat.rs). ScreenCaptureKit
# itself (macOS 12.3+) is weak-linked in build.rs.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCShareableContent",
    "SCStream",
    "SCScreenshotManager",
] }
objc2-image-io = "0.3"
objc2-application-services = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
